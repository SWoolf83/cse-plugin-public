<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=JetBrains+Mono:wght@400;500&display=swap');

        /* ==========================================================
           BASE VARIABLES — overridden by variant classes and brand
           injection. Brand colors injected via {{BRAND_CSS}} token.
           ========================================================== */

        :root {
            --accent: #3B82F6;
            --accent-light: #EFF6FF;
            --dark: #222222;
            --text: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --bg: #ffffff;
            --bg-callout: #f5f5f5;
            --bg-code: #1e1e1e;
            --border: #e0e0e0;
            --circle-bg: #1e3a5f;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-heading: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', monospace;
            --cover-title-size: 2.4rem;
            --body-size: 11pt;
            --line-height: 1.7;
            --section-number-display: flex;
            --callout-display: block;
            --heading-transform: none;
            --para-indent: 0;
            --para-spacing: 1rem;
        }

        /* ==========================================================
           VARIANT: MARKETING (default)
           Clean, modern, visual. Callouts prominent, warm spacing.
           ========================================================== */

        /* (base variables above are the marketing defaults) */

        /* ==========================================================
           VARIANT: TECHNICAL
           Tighter, code-forward, monospace accents, muted palette.
           ========================================================== */

        body.variant-technical {
            --accent: #6366F1;
            --accent-light: #EEF2FF;
            --circle-bg: #374151;
            --dark: #18181B;
            --bg-callout: #F4F4F5;
            --border: #D4D4D8;
            --font-heading: 'Inter', -apple-system, sans-serif;
            --cover-title-size: 2.1rem;
            --body-size: 10.5pt;
            --line-height: 1.6;
            --para-spacing: 0.85rem;
        }

        body.variant-technical .cover-doc-type {
            font-family: var(--font-mono);
            letter-spacing: 0.3em;
        }

        body.variant-technical .section-number {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            border-radius: 6px;
        }

        body.variant-technical pre {
            border: 1px solid #333;
            font-size: 0.9rem;
        }

        body.variant-technical .cover-brand {
            letter-spacing: 0.4em;
            font-size: 1.5rem;
        }

        /* ==========================================================
           VARIANT: LEGAL / FORMAL
           Conservative, serif option, numbered paragraphs, no
           callout boxes, traditional document feel.
           ========================================================== */

        body.variant-legal {
            --accent: #1E40AF;
            --accent-light: #EFF6FF;
            --circle-bg: #1E3A5F;
            --dark: #111827;
            --bg-callout: #F9FAFB;
            --border: #D1D5DB;
            --font-body: 'Merriweather', 'Georgia', 'Times New Roman', serif;
            --font-heading: 'Inter', -apple-system, sans-serif;
            --cover-title-size: 2.2rem;
            --body-size: 10.5pt;
            --line-height: 1.8;
            --section-number-display: none;
            --callout-display: block;
            --heading-transform: uppercase;
            --para-spacing: 0.9rem;
        }

        body.variant-legal .section-number {
            display: var(--section-number-display);
        }

        body.variant-legal .section-header h2 {
            font-size: 1.2rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
        }

        body.variant-legal .callout {
            border-left-width: 2px;
            font-style: italic;
        }

        body.variant-legal .cover-brand {
            font-family: var(--font-heading);
            letter-spacing: 0.5em;
        }

        body.variant-legal .toc-list li {
            font-family: var(--font-body);
        }

        /* ==========================================================
           BRAND INJECTION — replaced at render time
           ========================================================== */

        {{BRAND_CSS}}

        /* ==========================================================
           GLOBAL STYLES
           ========================================================== */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            line-height: var(--line-height);
            color: var(--text);
            background: var(--bg);
            font-size: var(--body-size);
        }

        /* ========== Cover Page ========== */

        .cover {
            min-height: 100vh;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2in 1in;
            position: relative;
        }

        .cover-brands {
            margin-bottom: 2.5rem;
        }

        .cover-brand {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.6em;
            color: #666666;
            text-transform: uppercase;
        }

        .cover-brand-divider {
            width: 32px;
            height: 1px;
            background: #444444;
            margin: 1rem auto;
        }

        .cover-org {
            font-size: 1.4rem;
            font-weight: 400;
            letter-spacing: 0.35em;
            color: #aaaaaa;
            text-transform: uppercase;
        }

        .cover-org:empty,
        .cover-org:empty + .cover-brand-divider {
            display: none;
        }

        .cover-accent-bar {
            width: 80px;
            height: 4px;
            background: var(--accent);
            margin: 0 auto 2.5rem;
        }

        .cover-doc-type {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.25em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .cover-title {
            font-size: var(--cover-title-size);
            font-weight: 700;
            font-family: var(--font-heading);
            color: #ffffff;
            line-height: 1.25;
            max-width: 700px;
            margin-bottom: 1.5rem;
        }

        .cover-subtitle {
            font-size: 1.15rem;
            font-weight: 300;
            color: #999999;
            max-width: 550px;
            line-height: 1.6;
            margin-bottom: 3rem;
            font-family: var(--font-body);
        }

        .cover-date {
            font-size: 0.85rem;
            color: #666666;
            letter-spacing: 0.1em;
        }

        /* ========== Table of Contents ========== */

        .toc {
            max-width: 8.5in;
            margin: 0 auto;
            padding: 1.5in 1in;
        }

        .toc h2 {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text);
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--accent);
        }

        .toc-list {
            list-style: none;
            counter-reset: toc-counter;
        }

        .toc-list li {
            counter-increment: toc-counter;
            padding: 0.65rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 1rem;
            color: var(--text-secondary);
        }

        .toc-list li::before {
            content: counter(toc-counter, decimal-leading-zero);
            font-weight: 600;
            color: var(--accent);
            margin-right: 1rem;
        }

        /* ========== Content Pages ========== */

        .page {
            max-width: 8.5in;
            margin: 0 auto;
            padding: 0.75in 1in;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            margin-top: 0.5rem;
        }

        .section-number {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--circle-bg);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .section-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text);
            line-height: 1.3;
        }

        .page p {
            margin-bottom: var(--para-spacing);
            color: var(--text-secondary);
            text-indent: var(--para-indent);
        }

        .page h3 {
            font-size: 1.05rem;
            font-weight: 600;
            font-family: var(--font-heading);
            color: var(--text);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .page ul, .page ol {
            margin: 0.75rem 0 1rem 1.5rem;
            color: var(--text-secondary);
        }

        .page li {
            margin-bottom: 0.4rem;
        }

        .page strong {
            color: var(--text);
            font-weight: 600;
        }

        .page a {
            color: var(--accent);
            text-decoration: none;
        }

        .page a:hover {
            text-decoration: underline;
        }

        /* Callout boxes */
        .callout {
            display: var(--callout-display);
            background: var(--bg-callout);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.25rem;
            margin: 1.25rem 0;
            border-radius: 0 4px 4px 0;
        }

        .callout p {
            margin-bottom: 0;
            font-size: 0.95rem;
            text-indent: 0;
        }

        /* Blockquotes */
        blockquote {
            background: var(--bg-callout);
            border-left: 3px solid var(--accent);
            padding: 1rem 1.25rem;
            margin: 1.25rem 0;
            border-radius: 0 4px 4px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        blockquote p {
            margin-bottom: 0;
        }

        /* Code blocks */
        pre {
            background: var(--bg-code);
            color: #d4d4d4;
            padding: 1rem 1.25rem;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.5;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: var(--font-mono);
        }

        code {
            font-family: var(--font-mono);
            font-size: 0.85em;
        }

        p code {
            background: var(--bg-callout);
            padding: 0.15em 0.4em;
            border-radius: 3px;
            color: var(--text);
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.25rem 0;
            font-size: 0.9rem;
        }

        thead th {
            background: var(--bg-callout);
            text-align: left;
            padding: 0.6rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }

        tbody td {
            padding: 0.55rem 0.8rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }

        tbody tr:hover {
            background: #fafafa;
        }

        /* Divider */
        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }

        /* ========== Sources ========== */

        .sources {
            max-width: 8.5in;
            margin: 0 auto;
            padding: 0.75in 1in 1.5in;
        }

        .sources h2 {
            font-size: 1.3rem;
            font-weight: 700;
            font-family: var(--font-heading);
            color: var(--text);
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--accent);
        }

        .sources ol {
            margin-left: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .sources li {
            margin-bottom: 0.35rem;
        }

        /* ========== Footer ========== */

        .footer {
            max-width: 8.5in;
            margin: 0 auto;
            padding: 1.5rem 1in;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.03em;
        }

        /* ========== Print Styles ========== */

        @page {
            size: letter;
            margin: 0.6in 0.75in 0.9in 0.75in;
        }

        @page :first {
            margin: 0;
        }

        @media print {
            body { font-size: 10pt; }

            .cover {
                break-after: page;
                min-height: 100vh;
                padding: 2in 1in;
            }

            .toc {
                break-after: page;
                padding: 0.5in 0;
            }

            .page {
                padding: 0.4in 0;
            }

            .section-header {
                break-after: avoid;
                break-inside: avoid;
            }

            .callout,
            blockquote,
            pre,
            table {
                break-inside: avoid;
            }

            h3 {
                break-after: avoid;
            }

            p {
                orphans: 3;
                widows: 3;
            }

            .footer {
                break-before: avoid;
                margin-top: 2rem;
            }

            a { color: var(--text-secondary); }
        }
    </style>
</head>
<body class="{{VARIANT}}">

    <!-- Cover Page -->
    <div class="cover">
        <div class="cover-brands">
            <div class="cover-brand">{{BRAND_NAME}}</div>
            <div class="cover-brand-divider"></div>
            <div class="cover-org">{{ORG_NAME}}</div>
        </div>
        <div class="cover-accent-bar"></div>
        <div class="cover-doc-type">{{DOC_TYPE}}</div>
        <h1 class="cover-title">{{TITLE}}</h1>
        <p class="cover-subtitle">{{SUBTITLE}}</p>
        <div class="cover-date">{{DATE}}</div>
    </div>

    <!-- Table of Contents -->
    <div class="toc">
        <h2>Contents</h2>
        <ol class="toc-list">
            {{TOC_ITEMS}}
        </ol>
    </div>

    {{SECTIONS}}

    <!-- Footer -->
    <div class="footer">
        {{FOOTER_TEXT}}
    </div>

</body>
</html>
